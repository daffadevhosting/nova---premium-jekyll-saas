<!-- Announcement Bar -->
<div id="announcement-bar" class="bg-blue-600 text-white text-xs md:text-sm font-medium py-2.5 px-4 text-center relative flex items-center justify-center transition-all duration-300 z-50">
  <span class="mr-2">🎉</span>
  <span>New: AI-powered workflow automation is now live! <a href="#features" class="underline hover:text-blue-100 font-bold ml-1">Explore what's new →</a></span>
  <button id="close-announcement" aria-label="Close Announcement" class="absolute right-4 p-1 hover:bg-blue-700 rounded-full transition outline-none focus:ring-2 focus:ring-white">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
    </svg>
  </button>
</div>

<!-- Header Section -->
<header id="main-header" class="sticky top-0 w-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 transition-colors duration-200 z-40">
  <div class="max-w-7xl mx-auto px-6 h-16 md:h-20 flex items-center justify-between">
    <!-- Brand Logo -->
    <a href="/" class="flex items-center gap-2.5 outline-none focus-visible:ring-2 focus-visible:ring-blue-600 rounded-lg">
      <div class="w-9 h-9 rounded-lg bg-blue-600 flex items-center justify-center text-white font-extrabold text-xl shadow-md shadow-blue-500/20">
        N
      </div>
      <span class="text-xl md:text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">
        {{ site.title }}
      </span>
    </a>

    <!-- Desktop Navigation Links -->
    <nav class="hidden md:flex items-center gap-8">
      {% for item in site.data.navigation.header %}
        <a href="{{ item.url }}" class="text-sm font-semibold text-slate-600 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 transition outline-none focus-visible:ring-2 focus-visible:ring-blue-600 rounded-md px-1 py-0.5">
          {{ item.title }}
        </a>
      {% endfor %}
    </nav>

    <!-- Right Controls (Theme Toggle + Auth + CTA) -->
    <div class="hidden md:flex items-center gap-5">
      <!-- Theme Switcher -->
      <button id="theme-toggle" aria-label="Toggle Dark Mode" class="p-2.5 rounded-lg border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition outline-none focus:ring-2 focus:ring-blue-600">
        <!-- Sun Icon -->
        <svg id="theme-toggle-light-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path>
        </svg>
        <!-- Moon Icon -->
        <svg id="theme-toggle-dark-icon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
      </button>

      <a href="/login/" class="text-sm font-semibold text-slate-700 dark:text-slate-300 hover:text-blue-600 dark:hover:text-blue-400 transition">
        Login
      </a>

      <a href="/signup/" class="inline-flex items-center justify-center text-sm font-semibold bg-blue-600 text-white hover:bg-blue-700 transition px-5 py-2.5 rounded-lg shadow-sm shadow-blue-500/10 outline-none focus:ring-2 focus:ring-blue-600">
        Get Started
      </a>
    </div>

    <!-- Mobile Navigation Toggle -->
    <div class="flex items-center gap-3 md:hidden">
      <!-- Mobile Theme Switcher -->
      <button id="mobile-theme-toggle" aria-label="Toggle Dark Mode" class="p-2 rounded-lg border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
      </button>

      <button id="menu-toggle" aria-expanded="false" aria-controls="mobile-drawer" aria-label="Open Mobile Menu" class="p-2 rounded-lg text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition outline-none focus:ring-2 focus:ring-blue-600">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Navigation Drawer -->
  <div id="mobile-drawer" class="fixed inset-0 top-[112px] bg-white dark:bg-slate-950 flex flex-col px-6 py-8 md:hidden border-t border-slate-200 dark:border-slate-800 translate-x-full transition-transform duration-300 ease-in-out z-30" style="display: none;">
    <nav class="flex flex-col gap-6">
      {% for item in site.data.navigation.header %}
        <a href="{{ item.url }}" class="mobile-nav-link text-lg font-bold text-slate-900 dark:text-white hover:text-blue-600 dark:hover:text-blue-400 transition">
          {{ item.title }}
        </a>
      {% endfor %}
      <hr class="border-slate-200 dark:border-slate-800 my-2">
      <a href="/login/" class="mobile-nav-link text-lg font-bold text-slate-900 dark:text-white hover:text-blue-600">
        Login
      </a>
      <a href="/signup/" class="inline-flex items-center justify-center text-base font-bold bg-blue-600 text-white py-3 rounded-lg shadow-sm mt-4">
        Get Started Free
      </a>
    </nav>
  </div>
</header>
