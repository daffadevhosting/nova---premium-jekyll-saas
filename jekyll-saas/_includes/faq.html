<section id="faq" class="py-20 lg:py-28 bg-white dark:bg-slate-950 transition-colors duration-200">
  <div class="max-w-4xl mx-auto px-6">
    
    <!-- Section Heading -->
    <div class="text-center max-w-2xl mx-auto mb-16 md:mb-20">
      <h2 class="text-xs font-bold tracking-widest text-blue-600 dark:text-blue-400 uppercase mb-3">
        Questions
      </h2>
      <h3 class="text-3xl md:text-5xl font-extrabold tracking-tight text-slate-900 dark:text-white leading-tight">
        Frequently asked questions.
      </h3>
      <p class="text-base text-slate-600 dark:text-slate-400 mt-4">
        Can't find what you're looking for? Reach out directly to our global developer support team.
      </p>
    </div>

    <!-- Accordion Wrapper -->
    <div class="flex flex-col gap-4">
      {% for item in site.data.faq %}
        <div class="faq-item border border-slate-150 dark:border-slate-800 rounded-2xl bg-slate-50/40 dark:bg-slate-900/40 transition duration-200 hover:border-slate-250 dark:hover:border-slate-700">
          
          <!-- Accordion Title Trigger -->
          <button class="faq-trigger w-full text-left p-6 md:p-8 flex items-center justify-between gap-6 outline-none focus-visible:ring-2 focus-visible:ring-blue-600 rounded-2xl"
                  aria-expanded="false" 
                  aria-controls="faq-content-{{ forloop.index }}"
                  id="faq-btn-{{ forloop.index }}">
            <span class="text-base md:text-lg font-bold text-slate-900 dark:text-white tracking-tight">
              {{ item.question }}
            </span>
            <!-- Icon rotation placeholder -->
            <span class="faq-icon-wrapper text-slate-400 dark:text-slate-500 transition duration-200 shrink-0">
              <svg class="w-5 h-5 transform duration-200" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
              </svg>
            </span>
          </button>

          <!-- Accordion Expandable Content -->
          <div class="faq-panel overflow-hidden max-h-0 transition-all duration-300 ease-in-out"
               id="faq-content-{{ forloop.index }}"
               role="region"
               aria-labelledby="faq-btn-{{ forloop.index }}"
               style="transition-property: max-height;">
            <div class="px-6 md:px-8 pb-6 md:pb-8 text-sm md:text-base text-slate-600 dark:text-slate-300 leading-relaxed border-t border-slate-150/40 dark:border-slate-800/40 pt-4">
              {{ item.answer }}
            </div>
          </div>

        </div>
      {% endfor %}
    </div>

  </div>
</section>
