---
layout: default
---

<article class="py-20 md:py-28">
  <div class="max-w-4xl mx-auto px-6">
    <header class="mb-12 border-b border-slate-200 dark:border-slate-800 pb-8">
      <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-slate-900 dark:text-white mb-4">
        {{ page.title }}
      </h1>
      {% if page.subtitle %}
        <p class="text-lg text-slate-600 dark:text-slate-400">
          {{ page.subtitle }}
        </p>
      {% endif %}
    </header>

    <div class="prose prose-slate dark:prose-invert max-w-none prose-headings:font-bold prose-a:text-blue-600 dark:prose-a:text-blue-400">
      {{ content }}
    </div>
  </div>
</article>
