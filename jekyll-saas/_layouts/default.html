<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  {% include head.html %}
</head>
<body class="min-h-screen bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-200 antialiased">
  <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-blue-600 focus:text-white focus:rounded-lg focus:outline-none">
    Skip to content
  </a>

  {% include header.html %}

  <main id="main-content" class="outline-none">
    {{ content }}
  </main>

  {% include footer.html %}

  <!-- Service Worker PWA Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('ServiceWorker registered successfully', reg))
          .catch(err => console.error('ServiceWorker registration failed', err));
      });
    }
  </script>
</body>
</html>
